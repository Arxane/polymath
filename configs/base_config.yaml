base_model: "Qwen/Qwen2.5-1.5B-Instruct"

lora:
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    lora_dropout: 0.05
    bias: "none"

training:
    num_epochs: 2
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2e-4
    warmup_ratio: 0.05
    max_seq_length: 512
    bf16: true
    gradient_checkpointing: true
    save_steps: 100
    logging_steps: 10

domains:
    math:
        dataset: "gsm8k"
        dataset_config: "main"
        split: "train"
        input_col: "question"
        output_col: "answer"
    physics:
        dataset: "camel-ai/physics"
        dataset_config: null
        split: "train"
        input_col: "personas"
        output_col: "message_2"
    chemistry:
        dataset: "camel-ai/chemistry"
        dataset_config: null
        split: "train"
        input_col: "personas"
        output_col: "message_2"
    biology:
        dataset: "camel-ai/biology"
        dataset_config: null
        split: "train"
        input_col: "personas"
        output_col: "message_2"
    finance:
        dataset: "gbharti/finance-alpaca"
        dataset_config: null
        split: "train"
        input_col: "instruction"
        output_col: "output"
        # finance-alpaca (~69k rows) is ~3.4x larger than the other domain
        # datasets (~20k rows each); cap training samples so training time
        # stays comparable across domains. Full data stays in
        # data/processed/finance.jsonl -- only the training subset is capped.
        max_train_samples: 20000
    psychology:
        dataset: "Amod/mental_health_counseling_conversations"
        dataset_config: null
        split: "train"
        input_col: "Context"
        output_col: "Response"

router:
    model: "HuggingFaceTB/SmolLM2-135M"
    num_labels: 6
    label_names: ["math", "physics", "chemistry", "biology", "finance", "psychology"]
    num_epochs: 3
    learning_rate: 2e-5
    batch_size: 16
    max_seq_length: 256
